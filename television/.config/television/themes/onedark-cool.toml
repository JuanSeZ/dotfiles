# OneDark Cool, the theme across the dotfiles (Ghostty, Rex, tmux, Neovim,
# lazygit, fzf...): television's onedark.toml on Cool's #242b38 background.
# general
background = '#242b38'
border_fg = '#5c6370'
text_fg = '#abb2bf'
dimmed_text_fg = '#c678dd'
# input
input_text_fg = '#e06c75'
