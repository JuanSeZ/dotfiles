---
- hosts: localhost
  tasks:
    - name: Install Chezmoi via Homebrew
      become: false
      community.general.homebrew:
        name: chezmoi
        state: present

    - name: Create Chezmoi source directory
      become: false
      file:
        path: "{{ ansible_env.HOME }}/.local/share/chezmoi"
        state: directory
        mode: '0755'

    - name: Copy Chezmoi configuration files
      become: false
      copy:
        src: "{{ playbook_dir }}/../dotfiles/{{ item.src }}"
        dest: "{{ item.dest }}"
        mode: '0644'
      with_items:
        - { src: '.chezmoi.toml', dest: '{{ ansible_env.HOME }}/.chezmoi.toml' }
        - { src: '.chezmoiignore', dest: '{{ ansible_env.HOME }}/.chezmoiignore' }

    - name: Initialize Chezmoi with dotfiles repository
      become: false
      command: chezmoi init --apply .
      args:
        chdir: "{{ playbook_dir }}/.."
      register: chezmoi_init
      changed_when: chezmoi_init.rc == 0
      failed_when: chezmoi_init.rc != 0 and "already initialized" not in chezmoi_init.stderr

    - name: Apply Chezmoi changes
      become: false
      command: chezmoi apply
      args:
        chdir: "{{ ansible_env.HOME }}" 