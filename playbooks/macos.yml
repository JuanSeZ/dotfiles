---
- name: Configure macOS settings
  hosts: localhost
  gather_facts: true
  tasks:
    - name: Check if running on macOS
      fail:
        msg: "This playbook can only be run on macOS"
      when: ansible_os_family != "Darwin"

    - name: Configure Dock settings
      osx_defaults:
        domain: com.apple.dock
        key: "{{ item.key }}"
        value: "{{ item.value }}"
        type: "{{ item.type | default('bool') }}"
      loop:
        - key: orientation
          value: right
          type: string
        - key: autohide
          value: true
        - key: region
          value: AR
          type: string
        - key: "wvous-br-corner"
          value: 14
          type: int
        - key: "wvous-br-modifier"
          value: 0
          type: int
        - key: "wvous-bl-corner"
          value: 0
          type: int
        - key: "wvous-bl-modifier"
          value: 0
          type: int
        - key: "wvous-tl-corner"
          value: 0
          type: int
        - key: "wvous-tl-modifier"
          value: 0
          type: int
        - key: "wvous-tr-corner"
          value: 0
          type: int
        - key: "wvous-tr-modifier"
          value: 0
          type: int

    - name: Configure Menubar settings
      osx_defaults:
        domain: NSGlobalDomain
        key: "{{ item.key }}"
        value: "{{ item.value }}"
        type: "{{ item.type | default('bool') }}"
      loop:
        - key: _HIHideMenuBar
          value: true
        - key: AppleMenuBarVisibleInFullscreen
          value: false

    - name: Configure Trackpad settings
      osx_defaults:
        domain: com.apple.AppleMultitouchTrackpad
        key: "{{ item.key }}"
        value: "{{ item.value }}"
        type: "{{ item.type | default('bool') }}"
      loop:
        - key: Clicking
          value: true
        - key: TrackpadRightClick
          value: true
        - key: TrackpadHandResting
          value: true
        - key: TrackpadHorizScroll
          value: true
        - key: TrackpadMomentumScroll
          value: true
        - key: TrackpadPinch
          value: true
        - key: TrackpadRotate
          value: true
        - key: TrackpadScroll
          value: true
        - key: TrackpadTwoFingerDoubleTapGesture
          value: true
        - key: TrackpadTwoFingerFromRightEdgeSwipeGesture
          value: 3
          type: int
        - key: TrackpadThreeFingerDrag
          value: false
        - key: TrackpadThreeFingerTapGesture
          value: 0
          type: int
        - key: TrackpadThreeFingerHorizSwipeGesture
          value: 2
          type: int
        - key: TrackpadThreeFingerVertSwipeGesture
          value: 2
          type: int
        - key: TrackpadFourFingerHorizSwipeGesture
          value: 2
          type: int
        - key: TrackpadFourFingerVertSwipeGesture
          value: 2
          type: int
        - key: TrackpadFourFingerPinchGesture
          value: 2
          type: int
        - key: TrackpadFiveFingerPinchGesture
          value: 2
          type: int
        - key: USBMouseStopsTrackpad
          value: false
        - key: ActuateDetents
          value: true
        - key: DragLock
          value: false
        - key: Dragging
          value: false
        - key: FirstClickThreshold
          value: 1
          type: int
        - key: SecondClickThreshold
          value: 1
          type: int
        - key: TrackpadCornerSecondaryClick
          value: false

    - name: Configure System Preferences
      osx_defaults:
        domain: "{{ item.domain }}"
        key: "{{ item.key }}"
        value: "{{ item.value }}"
        type: "{{ item.type | default('bool') }}"
      loop:
        - domain: NSGlobalDomain
          key: AppleShowAllExtensions
          value: true
        - domain: NSGlobalDomain
          key: ApplePressAndHoldEnabled
          value: false
        - domain: NSGlobalDomain
          key: InitialKeyRepeat
          value: 15
          type: int
        - domain: NSGlobalDomain
          key: KeyRepeat
          value: 2
          type: int
        - domain: com.apple.screensaver
          key: askForPassword
          value: 1
          type: int
        - domain: com.apple.screensaver
          key: askForPasswordDelay
          value: 0
          type: int

    - name: Restart affected services
      shell: |
        killall Dock
        killall Finder
        killall SystemUIServer
      ignore_errors: true 