- hosts: localhost
  tasks:
    - name: Ensure Homebrew is installed
      community.general.homebrew:
        update_homebrew: yes

    - name: Install nvm via Homebrew
      community.general.homebrew:
        name: nvm
        state: present

    - name: Source nvm script
      shell: |
        source $(brew --prefix nvm)/nvm.sh
      args:
        executable: /bin/zsh

    - name: Install latest Node.js version using nvm
      shell: |
        source $(brew --prefix nvm)/nvm.sh && nvm install node
      args:
        executable: /bin/zsh

    - name: Check installed Node.js version
      shell: |
        source $(brew --prefix nvm)/nvm.sh && nvm use node && node -v
      args:
        executable: /bin/zsh
      register: node_version

    - name: Show installed Node.js version
      debug:
        msg: "Installed Node.js version: {{ node_version.stdout }}"

