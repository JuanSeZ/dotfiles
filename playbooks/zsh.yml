- hosts: localhost
  tasks:
    - name: Check if Oh-My-Zsh is already installed
      stat:
        path: "{{ ansible_env.HOME }}/.oh-my-zsh"
      register: oh_my_stats

    - name: Install Oh-My-Zsh if not installed
      shell: |
        curl -L https://raw.github.com/robbyrussell/oh-my-zsh/master/tools/install.sh > ~/.oh-my-installer && chmod +x ~/.oh-my-installer && ~/.oh-my-installer
      when: not oh_my_stats.stat.exists
      become_user: "{{ ansible_env.USER }}"

    - name: Install zsh-autosuggestions using Homebrew
      community.general.homebrew:
        name: zsh-autosuggestions
        state: present

    - name: Install zsh-syntax-highlighting using Homebrew
      community.general.homebrew:
        name: zsh-syntax-highlighting
        state: present

    - name: Install zsh-completions using Homebrew
      community.general.homebrew:
        name: zsh-completions
        state: present
