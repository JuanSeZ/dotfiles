# Use zsh as default
set -g default-shell /bin/zsh

# General
set -g set-clipboard on         # Use system clipboard
set -g detach-on-destroy off    # Don't exit from tmux when closing a session
set -g escape-time 0            # Remove delay for exiting insert mode with ESC in Neovim
set -g history-limit 1000000    # Increase history size (from 2,000)
set -g mouse on                 # Enable mouse support
set -g status-interval 3        # Update the status bar every 3 seconds (default: 15 seconds)
set -g allow-passthrough on   # Allow programs in the pane to bypass tmux (e.g. for image preview)
set -g focus-events on          # Report terminal focus (agenmux notifications, Neovim autoread)
set-option -g status-position top
bind r source-file ~/.tmux.conf

# Enable vi mode to allow us to use vim keys to move around in copy mode (Prefix + [ places us in copy mode)
set-window-option -g mode-keys vi

# Start selecting text with "v"
bind-key -T copy-mode-vi 'v' send -X begin-selection 

# Copy text with "y" (stay in copy mode after yanking, like Vim)
bind -T copy-mode-vi 'y' send-keys -X copy-pipe "pbcopy"

# Paste yanked text with "Prefix + P" ("Prefix + p" goes to previous window)
bind P paste-buffer
 
# Don't exit copy mode when dragging with mouse
unbind -T copy-mode-vi MouseDragEnd1Pane

# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on # Automatically renumber windows when one is closed

bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# Resize panes with prefix + Ctrl-h/j/k/l, then keep Ctrl held and press h/j/k/l as long as needed.
# The first press enters the "resize" key table (no timeout); any other key leaves it and acts normally.
# Default Ctrl/Option-arrow resize keys are taken by macOS Spaces and Ghostty
bind-key C-h resize-pane -L 5 \; switch-client -T resize
bind-key C-j resize-pane -D 5 \; switch-client -T resize
bind-key C-k resize-pane -U 5 \; switch-client -T resize
bind-key C-l resize-pane -R 5 \; switch-client -T resize
bind-key -T resize C-h resize-pane -L 5 \; switch-client -T resize
bind-key -T resize C-j resize-pane -D 5 \; switch-client -T resize
bind-key -T resize C-k resize-pane -U 5 \; switch-client -T resize
bind-key -T resize C-l resize-pane -R 5 \; switch-client -T resize

# List of plugins
set -g @plugin 'tmux-plugins/tpm'

# AI agent monitor + session tree (prefix + A sidebar, prefix + e popup).
# Pinned to a release tag so TPM gets the prebuilt engine; auto-update is off in
# agenmux/.config/agenmux/config.toml. Upgrade with U inside the sidebar, then bump this tag.
set -g @plugin 'snirt/agenmux#v0.8.5'

# Other examples:
# set -g @plugin 'github_username/plugin_name'
# set -g @plugin 'github_username/plugin_name#branch'
# set -g @plugin 'git@github.com:user/plugin'
# set -g @plugin 'git@bitbucket.com:user/plugin'

# Theme - OneDark Cool

bg="#242b38"
default_fg="#abb2bf"
session_fg="#98c379"
selection_bg="#3e4452"
selection_fg="#abb2bf"
active_pane_border="#61afef"
active_window_fg="#61afef"

set -g status-left "#[fg=${session_fg},bold,bg=${bg}] #S#{?#{==:#{client_key_table},resize},#[fg=${active_window_fg}] RESIZE,}"
set -g status-right "#{agenmux} #[fg=${default_fg},bg=${bg}] 󰃮 %Y-%m-%d 󱑒 %H:%M" # #{agenmux} is expanded by the plugin
set -g status-justify centre
set -g status-left-length 200  # default: 10
set -g status-right-length 200 # default: 10
set-option -g status-style bg=${bg}
set -g window-status-current-format "#[fg=${active_window_fg},bg=default]  #I:#W"
set -g window-status-format "#[fg=${default_fg},bg=default] #I:#W"
set -g window-status-last-style "fg=${default_fg},bg=default"
set -g message-command-style bg=default,fg=${default_fg}
set -g message-style bg=default,fg=${default_fg}
set -g mode-style bg=${selection_bg},fg=${selection_fg}
set -g pane-active-border-style "fg=${active_pane_border},bg=default"
set -g pane-border-style 'fg=brightblack,bg=default'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

